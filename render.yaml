services:
  - type: web
    name: corvyn
    runtime: python
    plan: free
    buildCommand: "bash ./build.sh"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
    healthCheckPath: /api/health
    autoDeploy: true
